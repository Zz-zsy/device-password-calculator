<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>设备解密密码计算器</title>
  <style>
    :root {
      --bg: #edf5f4;
      --card: #ffffff;
      --ink: #17343b;
      --muted: #5e777d;
      --line: #d6e4e2;
      --accent: #087f80;
      --accent-dark: #056264;
      --gold: #f5b942;
      --danger: #b34b46;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 32px 16px;
      color: var(--ink);
      background: linear-gradient(135deg, #d4efeb, var(--bg));
      font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    }
    .app { width: min(760px, 100%); margin: 0 auto; }
    .card {
      background: var(--card);
      border: 1px solid rgba(8, 127, 128, .12);
      border-radius: 22px;
      padding: clamp(22px, 4vw, 42px);
      box-shadow: 0 18px 45px rgba(26, 78, 82, .14);
    }
    h1 { margin: 0 0 8px; font-size: clamp(25px, 5vw, 36px); letter-spacing: .02em; }
    .lead { margin: 0 0 26px; color: var(--muted); line-height: 1.6; }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
    .field { display: flex; flex-direction: column; gap: 7px; }
    label { font-size: 14px; font-weight: 700; }
    input {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 11px;
      padding: 12px 13px;
      font: inherit;
      color: var(--ink);
      background: #fbfefd;
      outline: none;
    }
    input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(8,127,128,.12); }
    .hint { color: var(--muted); font-size: 12px; line-height: 1.4; }
    .actions { display: flex; gap: 10px; margin-top: 22px; flex-wrap: wrap; }
    button {
      border: 0;
      border-radius: 11px;
      padding: 12px 18px;
      cursor: pointer;
      font: inherit;
      font-weight: 750;
    }
    .primary { color: #fff; background: var(--accent); }
    .primary:hover { background: var(--accent-dark); }
    .secondary { color: var(--ink); background: #e9f1ef; }
    .results { display: grid; gap: 12px; margin-top: 28px; }
    .result {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 14px;
      align-items: center;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 15px;
      background: #f8fcfb;
    }
    .result.permanent { border-color: #f1d58f; background: #fffaf0; }
    .result-title { font-weight: 800; margin-bottom: 6px; }
    output { display: block; font: 800 clamp(22px, 5vw, 32px)/1.1 ui-monospace, SFMono-Regular, Consolas, monospace; letter-spacing: .04em; word-break: break-all; }
    .copy { padding: 9px 12px; color: var(--ink); background: #fff; border: 1px solid var(--line); }
    .formula {
      margin-top: 25px;
      padding: 14px 16px;
      border-left: 4px solid var(--gold);
      background: #fffaf0;
      color: #604b23;
      line-height: 1.7;
      font-size: 14px;
    }
    .status { min-height: 22px; margin-top: 12px; color: var(--danger); font-size: 14px; }
    .footer { margin-top: 20px; color: var(--muted); font-size: 12px; line-height: 1.6; }
    @media (max-width: 600px) { .grid { grid-template-columns: 1fr 1fr; } .grid .field:first-child { grid-column: 1 / -1; } }
    @media (max-width: 390px) { .grid { grid-template-columns: 1fr; } .grid .field:first-child { grid-column: auto; } .result { grid-template-columns: 1fr; } }
  </style>
<link rel="manifest" href="manifest.json"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="密码计算器"></head>
<body>
  <main class="app">
    <section class="card" aria-labelledby="title">
      <h1 id="title">设备密码计算器</h1>
      <p class="lead">输入想要停止的时间、出厂编号和机型代码，按设备规则计算两组密码。</p>

      <div class="grid">
        <div class="field">
          <label for="stop">停止时间</label>
          <input id="stop" inputmode="numeric" autocomplete="off" placeholder="YYMMDDHH" maxlength="8" aria-describedby="stopHint">
          <div class="hint" id="stopHint">8 位数字：年份后两位 + 月 + 日 + 小时，例如 21110508</div>
        </div>
        <div class="field">
          <label for="factory">出厂编号</label>
          <input id="factory" inputmode="numeric" autocomplete="off" placeholder="例如 2105">
          <div class="hint">只填写数字</div>
        </div>
        <div class="field">
          <label for="model">机型代码</label>
          <input id="model" inputmode="numeric" autocomplete="off" placeholder="例如 108">
          <div class="hint">只填写数字</div>
        </div>
      </div>

      <div class="actions">
        <button class="primary" id="calculate" type="button">计算密码</button>
        <button class="secondary" id="reset" type="button">清空</button>
      </div>
      <div class="status" id="status" role="status" aria-live="polite"></div>

      <div class="results" aria-label="计算结果">
        <div class="result">
          <div><div class="result-title">临时解密密码（×4）</div><output id="temporary">—</output></div>
          <button class="copy" type="button" data-copy="temporary">复制</button>
        </div>
        <div class="result permanent">
          <div><div class="result-title">永久解除密码（×5）</div><output id="permanent">—</output></div>
          <button class="copy" type="button" data-copy="permanent">复制</button>
        </div>
      </div>

      <div class="formula">
        计算基数 =（停止时间 × 3 + 出厂编号 + 机型代码）<br>
        解密密码 = 计算基数 × 4　　永久解除密码 = 计算基数 × 5
      </div>
      <div class="footer">计算在本机浏览器内完成，不联网、不上传、不保存输入。请仅在你拥有授权的设备和维修流程中使用。</div>
    </section>
  </main>

  <script>
    (() => {
      const $ = (id) => document.getElementById(id);
      const stop = $('stop'), factory = $('factory'), model = $('model');
      const status = $('status'), temporary = $('temporary'), permanent = $('permanent');

      const digits = (value) => /^\d+$/.test(value);
      const calculate = () => {
        const x = stop.value.trim(), f = factory.value.trim(), m = model.value.trim();
        status.textContent = '';
        temporary.value = temporary.textContent = '—';
        permanent.value = permanent.textContent = '—';
        if (!/^\d{8}$/.test(x)) { status.textContent = '停止时间必须是 8 位数字，例如 21110508。'; stop.focus(); return; }
        if (!digits(f) || !f) { status.textContent = '出厂编号必须填写数字。'; factory.focus(); return; }
        if (!digits(m) || !m) { status.textContent = '机型代码必须填写数字。'; model.focus(); return; }
        const base = BigInt(x) * 3n + BigInt(f) + BigInt(m);
        temporary.textContent = (base * 4n).toString();
        permanent.textContent = (base * 5n).toString();
      };

      $('calculate').addEventListener('click', calculate);
      $('reset').addEventListener('click', () => {
        stop.value = factory.value = model.value = '';
        status.textContent = '';
        temporary.textContent = permanent.textContent = '—';
        stop.focus();
      });
      [stop, factory, model].forEach((input) => input.addEventListener('keydown', (event) => {
        if (event.key === 'Enter') calculate();
      }));
      document.querySelectorAll('[data-copy]').forEach((button) => button.addEventListener('click', async () => {
        const value = $(button.dataset.copy).textContent;
        if (value === '—') return;
        try {
          await navigator.clipboard.writeText(value);
          const old = button.textContent;
          button.textContent = '已复制';
          setTimeout(() => { button.textContent = old; }, 1100);
        } catch (_) {
          status.textContent = '当前浏览器未允许自动复制，请手动选择密码。';
        }
      }));
    })();
  </script>
<script>if ("serviceWorker" in navigator) { window.addEventListener("load", function(){ navigator.serviceWorker.register("sw.js"); }); }</script></body>
</html>
